# Fuente compartida de la topologia RabbitMQ de AndesStay.
# Maven la incluye en el backend y Rabbit Admin; Docker genera sus politicas desde aqui.
andesstay.rabbitmq.reservation-queue=andesstay.reservations
andesstay.rabbitmq.guest-queue=andesstay.guest-notifications
andesstay.rabbitmq.exchange=andesstay.reservations.direct
andesstay.rabbitmq.created-routing-key=reservation.created
andesstay.rabbitmq.confirmed-routing-key=reservation.confirmed
andesstay.rabbitmq.cancelled-routing-key=reservation.cancelled
andesstay.rabbitmq.dead-letter-exchange=andesstay.reservations.dlx
andesstay.rabbitmq.dead-letter-queue=andesstay.reservations.dlq

# Politicas para las colas reales: 24 horas de entrega y 7 dias de cuarentena.
andesstay.rabbitmq.delivery-policy-name=andesstay-reservation-delivery
andesstay.rabbitmq.quarantine-policy-name=andesstay-quarantine-retention
andesstay.rabbitmq.source-message-ttl-ms=86400000
andesstay.rabbitmq.source-max-length=10000
andesstay.rabbitmq.dead-letter-retention-ms=604800000

# Demostracion aislada: no escribe reservas ni avisos.
andesstay.rabbitmq.demo-queue=andesstay.delivery-demo
andesstay.rabbitmq.demo-dlx=andesstay.delivery-demo.dlx
andesstay.rabbitmq.demo-dlq=andesstay.delivery-demo.dlq
andesstay.rabbitmq.demo-message-ttl-ms=10000
andesstay.rabbitmq.demo-max-length=10
andesstay.messaging.demo-retention-ms=60000

# Recursos operativos administrables; los recursos de reservas se consultan solamente.
andesstay.rabbitmq.admin-resource-prefix=andesstay.ops.
