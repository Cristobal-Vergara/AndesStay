# Este archivo se incluye dentro del bloque http de Nginx.
# Todos los endpoints y alias de la API comparten la cuota de la IP conectada.
limit_req_zone $binary_remote_addr zone=andesstay_api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri /index.html; }
    location /api/ {
        limit_req zone=andesstay_api burst=20 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @api_rate_limit;

        proxy_pass http://bff:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @api_rate_limit {
        default_type application/problem+json;
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Demasiadas solicitudes","status":429,"detail":"Se enviaron demasiadas solicitudes. Espera 3 segundos y vuelve a intentarlo."}';
    }
}
