spring.application.name=andesstay
server.port=8080

# =========================
# MYSQL
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/andesstay}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# RABBITMQ
# =========================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# =========================
# KAFKA
# =========================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=andesstay-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =========================
# AZURE AD / MICROSOFT ENTRA ID
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/2fec6e6e-3e74-4c31-82ae-8cc3d1974636/
spring.security.oauth2.resourceserver.jwt.audiences=api://3e5c6423-0b9e-4125-b4ad-1b916c5c2f64