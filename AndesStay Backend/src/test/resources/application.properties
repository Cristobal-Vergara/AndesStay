spring.config.import=classpath:rabbit-topology.properties,classpath:rabbit-delivery.properties
spring.datasource.url=jdbc:h2:mem:application_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test/
spring.security.oauth2.resourceserver.jwt.audiences=api://test
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
andesstay.outbox.enabled=false
spring.jackson.deserialization.accept-float-as-int=false
logging.level.root=WARN
debug=false
