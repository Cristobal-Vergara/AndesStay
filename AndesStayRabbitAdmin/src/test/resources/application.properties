spring.config.import=classpath:rabbit-topology.properties
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test/
spring.security.oauth2.resourceserver.jwt.audiences=api://test
spring.rabbitmq.dynamic=false
spring.rabbitmq.host=localhost
spring.rabbitmq.username=test
spring.rabbitmq.password=test
andesstay.rabbitmq.management-url=http://localhost:15672
andesstay.rabbitmq.management-vhost=/
andesstay.rabbitmq.management-connect-timeout-ms=5000
andesstay.rabbitmq.management-read-timeout-ms=5000
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.rabbitmq.listener.simple.auto-startup=false
logging.level.root=WARN
debug=false
