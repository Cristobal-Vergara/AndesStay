spring.config.import=classpath:rabbit-topology.properties
spring.application.name=andesstay-rabbit-admin
server.port=8091
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:andesstay}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
andesstay.rabbitmq.management-url=${RABBITMQ_MANAGEMENT_URL:http://${spring.rabbitmq.host}:15672}
andesstay.rabbitmq.management-vhost=${RABBITMQ_VHOST:/}
andesstay.rabbitmq.management-connect-timeout-ms=5000
andesstay.rabbitmq.management-read-timeout-ms=5000
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
