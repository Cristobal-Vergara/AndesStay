# Entorno efimero: reutiliza la configuracion real, sin datos ni credenciales.
services:
  bff:
    image: node:24-bookworm-slim
    user: node
    command: ["node", "/test/bff-stub.mjs"]
    volumes:
      - ./bff-stub.mjs:/test/bff-stub.mjs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/_stats').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 30
  frontend:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ../../../AndesStay Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 1s
      timeout: 3s
      retries: 30
