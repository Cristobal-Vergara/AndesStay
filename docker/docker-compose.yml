name: andesstay-local
x-auth: &auth
  ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:?Ejecuta scripts/setup-local.ps1}
  ENTRA_AUDIENCE: ${ENTRA_AUDIENCE:?Ejecuta scripts/setup-local.ps1}
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: andesstay
      MYSQL_USER: ${DB_USERNAME:-andesstay}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Ejecuta scripts/setup-local.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta scripts/setup-local.ps1}
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-andesstay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Ejecuta scripts/setup-local.ps1}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes: [rabbit_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  rabbit-setup:
    image: rabbitmq:4.1-management
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        attempt=0
        # El ping del nodo puede responder antes de que su API HTTP este lista.
        until rabbitmqadmin --host rabbitmq --username "$$RABBITMQ_USERNAME" --password "$$RABBITMQ_PASSWORD" --timeout 3 --non-interactive show overview >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo 'La API de RabbitMQ no estuvo disponible para importar las definiciones.' >&2
            exit 1
          fi
          sleep 2
        done
        exec rabbitmqadmin --host rabbitmq --username "$$RABBITMQ_USERNAME" --password "$$RABBITMQ_PASSWORD" --non-interactive definitions import --file /config/andesstay-definitions.json
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-andesstay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - type: bind
        source: ../.validation/rabbitmq-definitions.json
        target: /config/andesstay-definitions.json
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      rabbitmq: { condition: service_healthy }
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["127.0.0.1:${KAFKA_PORT:-9092}:9092"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 25
      start_period: 20s
  backend:
    build: { context: "..", dockerfile: "AndesStay Backend/Dockerfile" }
    environment:
      <<: *auth
      SPRING_PROFILES_ACTIVE: local
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Santiago}
      DB_URL: jdbc:mysql://mysql:3306/andesstay?connectionTimeZone=UTC
      DB_USERNAME: ${DB_USERNAME:-andesstay}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      MESSAGING_DEMO_ENABLED: "true"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-andesstay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rabbit-setup: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
  bff:
    build: { context: "../AndesStayBFF" }
    environment:
      <<: *auth
      BACKEND_URL: http://backend:8080
    depends_on:
      backend: { condition: service_healthy }
  frontend:
    build:
      context: "../AndesStay Frontend"
      args:
        VITE_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
        VITE_ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
        VITE_ENTRA_SCOPE: ${ENTRA_SCOPE}
        VITE_APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Santiago}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:8080"]
    depends_on:
      bff: { condition: service_healthy }
  rabbit-admin:
    profiles: [operations]
    build: { context: "..", dockerfile: "AndesStayRabbitAdmin/Dockerfile" }
    environment:
      <<: *auth
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-andesstay}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:8091:8091"]
    depends_on:
      rabbitmq: { condition: service_healthy }
  kafka-admin:
    profiles: [operations]
    build: { context: "../AndesStayKafkaAdmin" }
    environment:
      <<: *auth
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["127.0.0.1:8092:8092"]
    depends_on:
      kafka: { condition: service_healthy }
volumes:
  mysql_data:
  rabbit_data:
  kafka_data:
