spring.application.name=andesstay-bff
server.port=8090
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}
backend.url=${BACKEND_URL:http://localhost:8080}
backend.connect-timeout-seconds=5
backend.read-timeout-seconds=15
andesstay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
